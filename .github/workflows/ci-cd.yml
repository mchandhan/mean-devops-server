name: MEAN Stack CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # -----------------------------
      # 1️⃣ Checkout Code
      # -----------------------------
      - name: Checkout Repository
        uses: actions/checkout@v3

      # -----------------------------
      # 2️⃣ Login to Docker Hub
      # -----------------------------
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # -----------------------------
      # 3️⃣ Build Backend Image
      # -----------------------------
      - name: Build Backend Docker Image
        run: |
          docker build -t chandhanm/mean-backend:latest ./backend

      # -----------------------------
      # 4️⃣ Push Backend Image
      # -----------------------------
      - name: Push Backend Docker Image
        run: |
          docker push chandhanm/mean-backend:latest

      # -----------------------------
      # 5️⃣ Build Frontend Image
      # -----------------------------
      - name: Build Frontend Docker Image
        run: |
          docker build -t chandhanm/mean-frontend:latest ./frontend

      # -----------------------------
      # 6️⃣ Push Frontend Image
      # -----------------------------
      - name: Push Frontend Docker Image
        run: |
          docker push chandhanm/mean-frontend:latest

      # -----------------------------
      # 7️⃣ Deploy to EC2
      # -----------------------------
      - name: Deploy to EC2 Server
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd mean-devops-server
            docker compose pull
            docker compose down
            docker compose up -d
